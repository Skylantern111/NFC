# CI (docs/SYSTEM_AUDIT_ROUND4.md A2): build + rules tests + flow replay on
# every push and pull request. No secrets: the build runs in preview mode
# (no Firebase env vars) and the tests use the local Firestore emulator.
name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Firestore emulator is a Java program.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Firebase emulator download
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Rules tests + flow replay (Firestore emulator)
        run: npm test
